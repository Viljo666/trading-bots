name = "drdoom-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Character art for the meme generator, imported as bytes.
[[rules]]
type = "Data"
globs = ["**/*.jpg"]
fallthrough = true

[ai]
binding = "AI"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

[vars]
CHAT_ID = "-1003955294607"   # DRDOOM Community Chat (@drdoommemechat)
MIN_BUY_SOL = "0.1"
BUY_ALERTS = "1"
MEME_HOURS = "10,18"           # UTC hours for an automatic AI meme; "" turns them off
# api.mainnet-beta.solana.com answers Cloudflare with HTTP 403; PublicNode is keyless.
SOLANA_RPC_URL = "https://solana-rpc.publicnode.com"

# Created with: wrangler d1 create drdoom-bot
[[d1_databases]]
binding = "DB"
database_name = "drdoom-bot"
database_id = "7f2bac7d-e168-4646-9d1a-4696ebbc8107"

# Secrets (wrangler secret put ...): BOT_TOKEN, WEBHOOK_SECRET
